<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kompas</title>
<meta name="description" content="Werkhulp voor performance marketing: KPI-diagnose, klantfiches, notities, rekenhulp en checklists.">
<meta name="theme-color" content="#1f3fae">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kompas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: gsm eerst. Eén kolom, vaste tabbalk onderaan, alles met de duim bereikbaar. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#e9ebf1; --line:#d5d9e3;
  --ink:#161b2c; --ink-2:#555d75; --accent:#1f3fae; --accent-ink:#ffffff;
  --up:#b3261e; --down:#1d5fae; --ok:#1d7a4f; --warn:#a85d00; --crit:#b3261e;
  --warn-bg:#fdf1dc; --crit-bg:#fbe9e7; --ok-bg:#e3f4ea;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#11141d; --surface:#1a1e2b; --surface-2:#242a3a; --line:#323a50;
    --ink:#e9ecf5; --ink-2:#a1a9c0; --accent:#8fa6ff; --accent-ink:#0f1320;
    --up:#ff8a80; --down:#8fc0ff; --ok:#5fcb97; --warn:#f0b452; --crit:#ff8a80;
    --warn-bg:#3a2d12; --crit-bg:#3a1d1c; --ok-bg:#163326;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{min-height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
header.bar h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
header.bar span{color:var(--ink-2);font-size:13px}
main{flex:1;padding:16px 16px calc(env(safe-area-inset-bottom) + 96px);display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 6px) max(8px,env(safe-area-inset-right));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12px;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:52px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--surface-2);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:0;font-size:18px;text-wrap:balance}
h3{margin:0;font-size:15px}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.rowx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;color:var(--accent);padding:8px 10px}
.btn.danger{color:var(--crit)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:88px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);min-width:0;flex:1 1 140px}
label.f>*{color:var(--ink);font-size:16px}

/* KPI-kiezer */
.kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.kpi:last-child{border-bottom:0}
.kpi b{display:block}
.seg{display:inline-grid;grid-template-columns:repeat(3,44px);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);min-height:40px;cursor:pointer;font-size:17px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.seg button[data-d="up"][aria-pressed="true"]{background:var(--up);color:#fff}
.seg button[data-d="down"][aria-pressed="true"]{background:var(--down);color:#fff}
@media (prefers-color-scheme: dark){.seg button[data-d][aria-pressed="true"]{color:#0f1320}}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:13px;border:1px solid var(--line);white-space:nowrap}
.tag.up{color:var(--up);border-color:var(--up)} .tag.down{color:var(--down);border-color:var(--down)}
.pattern{border-left:5px solid var(--accent)}
.cause{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.cause .lbl{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.cause.own{background:var(--ok-bg);border:0;border-radius:10px;padding:10px}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:20px;color:var(--ink-2)}
details[open]>summary::after{content:"–"}
details>.stack{margin-top:10px}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:none}
.item label{flex:1;cursor:pointer;overflow-wrap:anywhere}
.item.done label{text-decoration:line-through;color:var(--ink-2)}
.swatch{width:14px;height:14px;border-radius:4px;flex:none;display:inline-block}
.list-btn{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:56px}
.list-btn .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.out div{background:var(--surface-2);border-radius:10px;padding:10px}
.out b{display:block;font-size:19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.out span{font-size:13px;color:var(--ink-2)}
.notice{border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:14px}
.notice.ok{border-left-color:var(--ok);background:var(--ok-bg)} .notice.crit{border-left-color:var(--crit);background:var(--crit-bg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:13px}
.scroll{overflow-x:auto}
.empty{color:var(--ink-2);padding:8px 0}
@media (min-width:560px){.kpi-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,nav.tabs button{transition:background-color .12s,color .12s}}
</style>
</head>

/* ================= Opslag ================= */
const KEY = "kompas.v1";
const DEFAULTS = {dirs:{}, own:{}, cases:[], clients:[], notes:[], checks:{}, custom:{}, info:"", calc:{}};
let S = Object.assign({}, DEFAULTS);
let storageOk = true;
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign({}, DEFAULTS, JSON.parse(raw)); } catch(e){ storageOk = false; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch(e){ storageOk = false; } }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fDate = iso => { if(!iso) return ""; const p = iso.split("-"); return p.length===3 ? Number(p[2])+"/"+Number(p[1])+"/"+p[0] : iso; };
const num = v => { const n = parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",",".")); return isFinite(n) ? n : null; };
const nf = (n,d) => n==null||!isFinite(n) ? "–" : n.toLocaleString("nl-BE",{minimumFractionDigits:d,maximumFractionDigits:d});
const eur = (n,d) => n==null||!isFinite(n) ? "–" : "€ "+nf(n,d==null?2:d);
const pct = n => n==null||!isFinite(n) ? "–" : nf(n*100,2)+"%";
const clientName = id => { const c = S.clients.find(c => c.id===id); return c ? c.name : ""; };
const clientOptions = sel => '<option value="">Geen klant</option>'+S.clients.map(c => '<option value="'+c.id+'"'+(sel===c.id?" selected":"")+'>'+esc(c.name)+'</option>').join("");
const arrow = d => d==="up" ? "↑" : "↓";
const dirWord = d => d==="up" ? "stijgt" : "daalt";

/* ================= Navigatie ================= */
const TABS = {diagnose:"KPI-diagnose", klanten:"Klanten", notities:"Notities", reken:"Rekenhulp", meer:"Meer", checklists:"Checklists", info:"Handige info"};
let ui = {tab:"diagnose", client:null, note:null, list:null, flash:""};
function go(tab, extra){ ui = Object.assign({tab, client:null, note:null, list:null, flash:""}, extra||{}); render(); window.scrollTo(0,0); }
function render(){
  const main = ["diagnose","klanten","notities","reken"].includes(ui.tab) ? ui.tab : "meer";
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab===main) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  document.getElementById("title").textContent = TABS[ui.tab] || "Kompas";
  document.getElementById("subtitle").textContent = storageOk ? "" : "opslaan lukt niet in deze browser";
  document.getElementById("view").innerHTML = VIEWS[ui.tab]();
}

  }
  let h = '<div><button class="btn primary" data-a="note-new">Nieuwe notitie</button></div>';
  if (!S.notes.length) h += '<div class="card"><p class="muted">Noteer tijdens een meeting en zet er actiepunten onder. Met één tik kopieer je alles om in Asana of een mail te plakken.</p></div>';
  S.notes.slice().sort((a,b) => (b.date||"").localeCompare(a.date||"")).forEach(n => { const open = n.actions.filter(a => !a.done).length;
    h += '<button class="list-btn" data-a="note-open" data-id="'+n.id+'"><span class="grow"><b>'+esc(n.title||"Zonder titel")+'</b><br><span class="muted small">'+esc(fDate(n.date))+(clientName(n.client)?' · '+esc(clientName(n.client)):'')+(open?' · '+open+' open '+(open===1?'actie':'acties'):'')+'</span></span><span class="muted">›</span></button>'; });
  return h;
};

function calcField(group,key,label,type,ph){ const v = (S.calc[group]||{})[key]; return '<label class="f">'+label+'<input type="'+(type||"text")+'" '+(type==="date"?'':'inputmode="decimal" ')+'data-f="calc" data-g="'+group+'" data-p="'+key+'" value="'+esc(v==null?"":v)+'"'+(ph?' placeholder="'+ph+'"':'')+'></label>'; }
function outPacing(){
  const c = S.calc.pacing||{}, budget = num(c.budget), spent = num(c.spent);
  if (budget==null || !c.start || !c.end) return '<div class="empty">Vul budget, start- en einddatum in.</div>';
  const d0 = new Date(c.start+"T12:00:00"), d1 = new Date(c.end+"T12:00:00"), now = new Date(today()+"T12:00:00");
  const total = Math.round((d1-d0)/86400000)+1; if (!(total>0)) return '<div class="notice crit">De einddatum ligt voor de startdatum.</div>';
  const elapsed = Math.max(0, Math.min(total, Math.round((now-d0)/86400000)));   // volledig afgelopen dagen, vandaag niet meegeteld
  const left = total-elapsed, expected = budget*elapsed/total;
  let h = '<div class="out"><div><b>'+eur(expected)+'</b><span>verwacht besteed na '+elapsed+' van '+total+' dagen</span></div><div><b>'+eur(budget/total)+'</b><span>gemiddeld per dag over de hele looptijd</span></div>';
  if (spent!=null){
    const pace = expected>0 ? spent/expected : null, rest = budget-spent;
    h += '<div><b>'+(pace==null?"–":nf(pace*100,0)+"%")+'</b><span>van het verwachte tempo</span></div><div><b>'+(left>0?eur(rest/left):"–")+'</b><span>nodig per dag voor de resterende '+left+' dagen</span></div></div>';
    if (pace!=null && left>0){
      const proj = spent + (elapsed>0 ? spent/elapsed*left : 0);
      h += '<div class="notice '+(pace<0.9?"":pace>1.1?"crit":"ok")+'">'+(pace<0.9?"Underspend":pace>1.1?"Overspend":"Op schema")+': aan het huidige tempo eindig je op '+eur(proj,0)+' van '+eur(budget,0)+'.</div>';
    }
  } else h += '</div>';
  return h;
}
function outKpi(){
  const c = S.calc.kpi||{}, cost = num(c.cost), imp = num(c.imp), clk = num(c.clk), conv = num(c.conv), rev = num(c.rev);
  const div = (a,b) => a!=null && b ? a/b : null;
  return '<div class="out"><div><b>'+pct(div(clk,imp))+'</b><span>CTR</span></div><div><b>'+eur(div(cost,clk))+'</b><span>CPC</span></div>'+
    '<div><b>'+pct(div(conv,clk))+'</b><span>CVR</span></div><div><b>'+eur(div(cost,conv))+'</b><span>CPA</span></div>'+
    '<div><b>'+(div(cost,imp)==null?"–":eur(div(cost,imp)*1000))+'</b><span>CPM</span></div><div><b>'+(div(rev,cost)==null?"–":nf(div(rev,cost),2))+'</b><span>ROAS</span></div></div>';
}
function outForecast(){
  const c = S.calc.fc||{}, budget = num(c.budget), cpc = num(c.cpc), cvr = num(c.cvr), aov = num(c.aov);
  if (budget==null || !cpc) return '<div class="empty">Vul budget en verwachte CPC in.</div>';
  const clicks = budget/cpc, conv = cvr!=null ? clicks*cvr/100 : null;
  return '<div class="out"><div><b>'+nf(clicks,0)+'</b><span>klikken</span></div><div><b>'+(conv==null?"–":nf(conv,1))+'</b><span>conversies</span></div>'+
    '<div><b>'+(conv?eur(budget/conv):"–")+'</b><span>CPA</span></div><div><b>'+(conv&&aov?nf(conv*aov/budget,2):"–")+'</b><span>ROAS'+(aov?'':' (vul orderwaarde in)')+'</span></div></div>';
}
function outBreakeven(){
  const c = S.calc.be||{}, m = num(c.margin), aov = num(c.aov);
  if (!m) return '<div class="empty">Vul de marge in.</div>';
  return '<div class="out"><div><b>'+nf(100/m,2)+'</b><span>break-even ROAS</span></div><div><b>'+(aov?eur(aov*m/100):"–")+'</b><span>maximale CPA'+(aov?'':' (vul orderwaarde in)')+'</span></div></div>';
}
VIEWS.reken = () =>
  '<div class="card"><h2>Budget-pacing</h2><div class="rowx">'+calcField("pacing","budget","Totaal budget (€)")+calcField("pacing","spent","Al besteed (€)")+'</div>'+
  '<div class="rowx">'+calcField("pacing","start","Startdatum","date")+calcField("pacing","end","Einddatum","date")+'</div><p class="muted small">Vandaag telt niet mee als afgelopen dag.</p><div id="out-pacing">'+outPacing()+'</div></div>'+
  '<div class="card"><h2>KPI\'s uitrekenen</h2><div class="rowx">'+calcField("kpi","cost","Kosten (€)")+calcField("kpi","imp","Impressies")+'</div><div class="rowx">'+calcField("kpi","clk","Klikken")+calcField("kpi","conv","Conversies")+'</div><div class="rowx">'+calcField("kpi","rev","Omzet (€)")+'</div><div id="out-kpi">'+outKpi()+'</div></div>'+
  '<div class="card"><h2>Forecast</h2><div class="rowx">'+calcField("fc","budget","Budget (€)")+calcField("fc","cpc","Verwachte CPC (€)")+'</div><div class="rowx">'+calcField("fc","cvr","Verwachte CVR (%)")+calcField("fc","aov","Gem. orderwaarde (€)")+'</div><div id="out-fc">'+outForecast()+'</div></div>'+
  '<div class="card"><h2>Break-even</h2><div class="rowx">'+calcField("be","margin","Marge (%)")+calcField("be","aov","Gem. orderwaarde (€)")+'</div><div id="out-be">'+outBreakeven()+'</div></div>';

VIEWS.meer = () =>
  '<button class="list-btn" data-a="go" data-tab="checklists"><span class="grow"><b>Checklists</b><br><span class="muted small">Campagne live zetten, rapportage, quarterly, wekelijkse check</span></span><span class="muted">›</span></button>'+
  '<button class="list-btn" data-a="go" data-tab="info"><span class="grow"><b>Handige info</b><br><span class="muted small">Formules, begrippen, tekstlimieten en je eigen spiekbriefje</span></span><span class="muted">›</span></button>'+
  '<a class="list-btn" href="'+COCKPIT_URL+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="grow"><b>Vandaag: agenda en taken</b><br><span class="muted small">Opent je Klantencockpit in Claude</span></span><span class="muted">↗</span></a>'+
  '<div class="card"><h2>Back-up</h2><p class="muted small">Alles wat je invult staat alleen op dit toestel. Maak af en toe een back-up, zeker voor je van gsm wisselt.</p>'+
  '<div class="rowx"><button class="btn" data-a="export">Download back-up</button><button class="btn" data-a="export-copy">'+(ui.flash||"Kopieer back-up")+'</button></div>'+
  '<label class="f">Back-up terugzetten<input type="file" id="import-file" accept="application/json,.json"></label>'+(ui.msg?'<div class="notice '+(ui.msgOk?"ok":"crit")+'">'+esc(ui.msg)+'</div>':'')+'</div>'+
  '<div class="card"><h2>Op je beginscherm zetten</h2><p><b>iPhone:</b> open deze pagina in Safari, tik op Deel en kies Zet op beginscherm.</p><p><b>Android:</b> open in Chrome, tik op het menu met de drie puntjes en kies App installeren.</p><p class="muted small">Na de eerste keer openen werkt de app ook zonder internet.</p></div>';

VIEWS.checklists = () => {
  let h = '<div><button class="btn ghost" data-a="go" data-tab="meer">‹ Meer</button></div>';
  CHECKLISTS.forEach(l => { const items = l.i.concat(S.custom[l.id]||[]), st = S.checks[l.id]||{}, done = items.filter((_,i) => st[i]).length;
    h += '<div class="card"><details'+(ui.list===l.id?" open":"")+' data-list="'+l.id+'"><summary><span>'+esc(l.t)+' <span class="muted small mono">'+done+'/'+items.length+'</span></span></summary><div class="stack"><div>'+
      items.map((t,i) => '<div class="item'+(st[i]?" done":"")+'"><input type="checkbox" id="ck-'+l.id+'-'+i+'" data-f="check" data-l="'+l.id+'" data-i="'+i+'"'+(st[i]?" checked":"")+'><label for="ck-'+l.id+'-'+i+'">'+esc(t)+'</label>'+
        (i>=l.i.length?'<button class="btn ghost sm danger" data-a="check-del" data-l="'+l.id+'" data-i="'+(i-l.i.length)+'" aria-label="Verwijder punt">✕</button>':'')+'</div>').join("")+'</div>'+
      '<div class="rowx"><label class="f">Eigen punt toevoegen<input type="text" id="ck-new-'+l.id+'"></label></div>'+
      '<div class="rowx"><button class="btn sm" data-a="check-add" data-l="'+l.id+'">Voeg toe</button><button class="btn sm" data-a="check-reset" data-l="'+l.id+'">Begin opnieuw</button></div></div></details></div>'; });
  return h;
};

VIEWS.info = () =>
  '<div><button class="btn ghost" data-a="go" data-tab="meer">‹ Meer</button></div>'+
  '<div class="card"><h2>Eigen spiekbriefje</h2><textarea data-f="info" style="min-height:140px" placeholder="Alles wat je steeds opnieuw moet opzoeken: logins waar ze staan, vaste benchmarks, afspraken in het team…">'+esc(S.info)+'</textarea></div>'+
  '<div class="card"><h2>Formules</h2><div class="scroll"><table>'+FORMULAS.map(f => '<tr><th scope="row">'+esc(f[0])+'</th><td>'+esc(f[1])+'</td></tr>').join("")+'</table></div></div>'+
  '<div class="card"><h2>Tekstlimieten en formaten</h2>'+SPECS.map(s => '<div class="cause"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>').join("")+'<p class="muted small">Platformen passen dit geregeld aan. Controleer bij twijfel in het platform zelf.</p></div>'+
  '<div class="card"><h2>Begrippen</h2>'+GLOSSARY.map(g => '<div class="cause"><b>'+esc(g[0])+'</b><span>'+esc(g[1])+'</span></div>').join("")+'</div>';

/* ================= Acties ================= */
const curNote = () => S.notes.find(n => n.id===ui.note);
const curClient = () => S.clients.find(c => c.id===ui.client);
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
function backupText(){ return JSON.stringify({app:"kompas", version:1, exported:new Date().toISOString(), data:S}, null, 1); }
const A = {
  go: b => go(b.dataset.tab),
  dir: b => { if (b.dataset.d) S.dirs[b.dataset.k] = b.dataset.d; else delete S.dirs[b.dataset.k]; save(); ui.flash=""; render(); },
  "dirs-clear": () => { S.dirs = {}; save(); render(); },
  "own-add": b => { const t = val("own-"+b.dataset.k); if (!t) return; const key = b.dataset.k+":"+b.dataset.d; (S.own[key] = S.own[key]||[]).push(t); save(); render(); },
  "own-del": b => { const l = S.own[b.dataset.key]||[]; l.splice(Number(b.dataset.i),1); save(); render(); },
  "case-add": () => { const t = val("case-text"); if (!t){ ui.flash = "Schrijf eerst wat de oorzaak was."; return render(); }
    S.cases.unshift({id:uid(), date:today(), client:val("case-client"), dirs:Object.assign({},S.dirs), text:t}); save(); ui.flash = "Case bewaard in het logboek."; render(); },
  "case-del": b => { S.cases = S.cases.filter(c => c.id!==b.dataset.id); save(); render(); },
  "case-load": b => { const c = S.cases.find(c => c.id===b.dataset.id); if (c){ S.dirs = Object.assign({},c.dirs); save(); go("diagnose"); } },
  "client-add": () => { const n = val("client-name"); if (!n) return; const c = {id:uid(), name:n, color:COLORS[S.clients.length%COLORS.length], contacts:"", meetings:"", links:"", naming:"", goals:"", notes:""}; S.clients.push(c); save(); go("klanten",{client:c.id}); },
  "client-open": b => go("klanten",{client:b.dataset.id}),
  "client-back": () => go("klanten"),
  "client-color": b => { const c = curClient(); if (c){ c.color = b.dataset.c; save(); render(); } },
  "client-del": b => { if (b.dataset.step==="1"){ ui.confirm = true; return render(); } S.clients = S.clients.filter(c => c.id!==ui.client); save(); go("klanten"); },
  "note-new": b => { const n = {id:uid(), title:"", client:(b.dataset.client||""), date:today(), text:"", actions:[]}; S.notes.push(n); save(); go("notities",{note:n.id}); },
  "note-open": b => go("notities",{note:b.dataset.id}),
  "note-back": () => go("notities"),
  "note-del": b => { if (b.dataset.step==="1"){ ui.confirm = true; return render(); } S.notes = S.notes.filter(n => n.id!==ui.note); save(); go("notities"); },
  "action-add": () => { const n = curNote(), t = val("action-new"); if (!n||!t) return; n.actions.push({t, done:false}); save(); render(); const el = document.getElementById("action-new"); if (el) el.focus(); },
  "action-del": b => { const n = curNote(); if (!n) return; n.actions.splice(Number(b.dataset.i),1); save(); render(); },
  "note-copy": async () => { const n = curNote(); if (!n) return;
    const lines = [(n.title||"Notitie")+(clientName(n.client)?" · "+clientName(n.client):"")+" · "+fDate(n.date), "", n.text||"", "", "Actiepunten"].concat(n.actions.map(a => "- ["+(a.done?"x":" ")+"] "+a.t));
    try { await navigator.clipboard.writeText(lines.join("\n")); ui.flash = "Gekopieerd"; } catch(e){ ui.flash = "Kopiëren lukte niet"; }
    render(); setTimeout(() => { ui.flash = ""; if (ui.note) render(); }, 1800); },
  "check-add": b => { const t = val("ck-new-"+b.dataset.l); if (!t) return; (S.custom[b.dataset.l] = S.custom[b.dataset.l]||[]).push(t); save(); ui.list = b.dataset.l; render(); },
  "check-del": b => { const l = b.dataset.l, base = CHECKLISTS.find(x => x.id===l).i.length, i = Number(b.dataset.i); (S.custom[l]||[]).splice(i,1);
    const st = S.checks[l]||{}, n = {}; Object.keys(st).forEach(k => { const j = Number(k); if (j<base+i) n[j] = st[k]; else if (j>base+i) n[j-1] = st[k]; }); S.checks[l] = n; save(); ui.list = l; render(); },
  "check-reset": b => { S.checks[b.dataset.l] = {}; save(); ui.list = b.dataset.l; render(); },
  "export": () => { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([backupText()],{type:"application/json"})); a.download = "kompas-backup-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); } catch(e){ ui.msg = "Downloaden lukte niet. Gebruik Kopieer back-up."; ui.msgOk = false; render(); } },
  "export-copy": async () => { try { await navigator.clipboard.writeText(backupText()); ui.flash = "Gekopieerd"; } catch(e){ ui.flash = "Kopiëren lukte niet"; } render(); setTimeout(() => { ui.flash = ""; if (ui.tab==="meer") render(); }, 1800); }
};
document.addEventListener("click", e => {
  const t = e.target.closest("nav.tabs button"); if (t) return go(t.dataset.tab);
  const b = e.target.closest("[data-a]"); if (b && A[b.dataset.a]) A[b.dataset.a](b);
});
function onField(el){
  const f = el.dataset.f; if (!f) return false;
  if (f==="client"){ const c = curClient(); if (c) c[el.dataset.p] = el.value; }
  else if (f==="note"){ const n = curNote(); if (n) n[el.dataset.p] = el.value; }
  else if (f==="info"){ S.info = el.value; }
  else if (f==="calc"){ (S.calc[el.dataset.g] = S.calc[el.dataset.g]||{})[el.dataset.p] = el.value;
    const map = {pacing:["out-pacing",outPacing], kpi:["out-kpi",outKpi], fc:["out-fc",outForecast], be:["out-be",outBreakeven]}[el.dataset.g];
    if (map){ const o = document.getElementById(map[0]); if (o) o.innerHTML = map[1](); } }
  else return false;
  save(); return true;
}
document.addEventListener("input", e => { onField(e.target); });
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.f==="check"){ (S.checks[el.dataset.l] = S.checks[el.dataset.l]||{})[el.dataset.i] = el.checked; if (!el.checked) delete S.checks[el.dataset.l][el.dataset.i]; save(); ui.list = el.dataset.l; render(); }
  else if (el.dataset.f==="action"){ const n = curNote(); if (n && n.actions[el.dataset.i]){ n.actions[el.dataset.i].done = el.checked; save(); render(); } }
  else if (el.id==="import-file" && el.files && el.files[0]){
    const r = new FileReader();
    r.onload = () => { try { const j = JSON.parse(r.result); const d = j && j.app==="kompas" && j.data; if (!d || typeof d!=="object") throw new Error("geen back-up");
        S = Object.assign({}, DEFAULTS, d); ["cases","clients","notes"].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; }); save(); ui.msg = "Back-up teruggezet."; ui.msgOk = true; }
      catch(err){ ui.msg = "Dit bestand is geen back-up van Kompas."; ui.msgOk = false; } render(); };
    r.readAsText(el.files[0]);
  }
  else if (el.matches("select[data-f], input[type=date][data-f]")) onField(el);
});
document.addEventListener("keydown", e => {
  if (e.key!=="Enter" || e.target.tagName!=="INPUT") return;
  const map = {"client-name":"client-add", "action-new":"action-add"};
  if (map[e.target.id]) A[map[e.target.id]](e.target);
  else if (e.target.id.indexOf("ck-new-")===0) A["check-add"]({dataset:{l:e.target.id.slice(7)}});
});
render();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
